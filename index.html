<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alivio</title>
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <section class="nav">
      <div class="nav__container">
        <div class="nav__inner">
          <a href="#"><img class="nav__logo" src="img/logo.svg" alt="logo"></a>
          <ul class="nav__menu">
            <li><a href="#">Why Alivio</a></li>
            <li><a href="#">Solutions</a></li>
            <li><a href="#">Community</a></li>
            <li><a href="#">Pricing</a></li>
          </ul>
          <div class="nav__buttons">
            <a class="nav__buttons-link" href="#">Sign in</a>
            <button class="nav__buttons-button">Start Trial</button>
          </div>
        </div>
      </div>
    </section>
    
    <section class="hero">
      <div class="hero__container">
        <div class="hero__inner">
          <h1 class="hero__title">Be aware, Manage well.</h1>
          <p class="hero__text">Everyone experiences stress in different ways. Let Alivio guide you, in a personalized journal experience, to overcome your stress.</p>
          <button class="hero__button">Find Your Way</button>
        </div>
      </div>
    </section>
  </header>

</html>
